secrets:
  dev:
    vault_path: auth0/data/dvh/dev
    variables:
      AUTH0_DOMAIN: dev-auth.dvh.example.com
      AUTH0_CLIENT_ID_NATIVE: kv:auth0/dev/mobile/client_id
      AUTH0_CLIENT_SECRET_NATIVE: kv:auth0/dev/mobile/client_secret
      AUTH0_CLIENT_ID_M2M: kv:auth0/dev/m2m/client_id
      AUTH0_CLIENT_SECRET_M2M: kv:auth0/dev/m2m/client_secret
      AUTH0_JWKS_URL: https://dev-auth.dvh.example.com/.well-known/jwks.json
      AUTH0_AUDIENCE_API: https://dev-api.dvh.example.com
    rotation:
      schedule: "0 3 * * 0" # Sundays at 03:00 UTC
      method: manual
      owner: platform-security@dvh.example.com
  test:
    vault_path: auth0/data/dvh/test
    variables:
      AUTH0_DOMAIN: test-auth.dvh.example.com
      AUTH0_CLIENT_ID_NATIVE: kv:auth0/test/mobile/client_id
      AUTH0_CLIENT_SECRET_NATIVE: kv:auth0/test/mobile/client_secret
      AUTH0_CLIENT_ID_M2M: kv:auth0/test/m2m/client_id
      AUTH0_CLIENT_SECRET_M2M: kv:auth0/test/m2m/client_secret
      AUTH0_JWKS_URL: https://test-auth.dvh.example.com/.well-known/jwks.json
      AUTH0_AUDIENCE_API: https://test-api.dvh.example.com
    rotation:
      schedule: "0 4 * * 0"
      method: manual
      owner: platform-security@dvh.example.com
  prod:
    vault_path: auth0/data/dvh/prod
    variables:
      AUTH0_DOMAIN: auth.dvh.example.com
      AUTH0_CLIENT_ID_NATIVE: kv:auth0/prod/mobile/client_id
      AUTH0_CLIENT_SECRET_NATIVE: kv:auth0/prod/mobile/client_secret
      AUTH0_CLIENT_ID_M2M: kv:auth0/prod/m2m/client_id
      AUTH0_CLIENT_SECRET_M2M: kv:auth0/prod/m2m/client_secret
      AUTH0_JWKS_URL: https://auth.dvh.example.com/.well-known/jwks.json
      AUTH0_AUDIENCE_API: https://api.dvh.example.com
    rotation:
      schedule: "0 5 * * 0"
      method: automated
      owner: platform-security@dvh.example.com

ci_cd:
  provider: github-actions
  secrets:
    - name: AUTH0_DOMAIN
      source: vault
    - name: AUTH0_CLIENT_ID_NATIVE
      source: vault
    - name: AUTH0_CLIENT_SECRET_NATIVE
      source: vault
    - name: AUTH0_CLIENT_ID_M2M
      source: vault
    - name: AUTH0_CLIENT_SECRET_M2M
      source: vault
    - name: AUTH0_AUDIENCE_API
      source: vault
  sync_strategy:
    - step: "Vault -> GitHub Actions environment secrets"
    - step: "Repository environment -> runtime pod environment variables"

notes:
  - "Never commit actual secret values; reference Vault paths only."
  - "Ensure CI has restricted read-only access scoped per environment."
  - "Update rotation schedule once automated rotation tooling is available for all environments."
