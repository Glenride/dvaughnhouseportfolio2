<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 560px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      form,
      section {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 1rem;
        margin-bottom: 1.5rem;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
      }
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 0.5rem;
        margin-bottom: 1rem;
        border: 1px solid #bbb;
        border-radius: 4px;
      }
      button {
        padding: 0.5rem 1rem;
        border-radius: 4px;
        border: none;
        background-color: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      pre {
        background: #f4f4f4;
        padding: 1rem;
        overflow-x: auto;
      }
      .status {
        margin: 0.5rem 0;
        font-weight: bold;
      }
      .status.error {
        color: #c0392b;
      }
      .status.success {
        color: #27ae60;
      }
    </style>
  </head>
  <body>
    <h1>Enterprise Auth Demo</h1>
    <p>This simple page lets you log in and call a protected API using the new Auth0-backed backend.</p>

    <form id="login-form">
      <h2>Log In</h2>
      <label>
        Email
        <input type="email" id="email" required />
      </label>
      <label>
        Password
        <input type="password" id="password" required />
      </label>
      <button type="submit" id="login-button">Log In</button>
      <div class="status" id="login-status"></div>
    </form>

    <section>
      <h2>Protected API</h2>
      <p>Once logged in, use your access token to fetch profile data from the protected endpoint.</p>
      <button id="profile-button" disabled>Fetch Protected Profile</button>
      <div class="status" id="profile-status"></div>
      <pre id="profile-output">(no data yet)</pre>
    </section>

    <section>
      <h2>Stored Tokens</h2>
      <button id="clear-button" disabled>Clear Tokens</button>
      <pre id="token-output">(no tokens yet)</pre>
    </section>

    <script>
      const API_BASE_URL = (() => {
        if (window.API_BASE_URL) return window.API_BASE_URL;
        const { protocol, hostname } = window.location;
        const defaultPort = "4000";
        return `${protocol}//${hostname}:${defaultPort}`;
      })();

      const loginForm = document.getElementById("login-form");
      const loginStatus = document.getElementById("login-status");
      const profileButton = document.getElementById("profile-button");
      const profileStatus = document.getElementById("profile-status");
      const profileOutput = document.getElementById("profile-output");
      const tokenOutput = document.getElementById("token-output");
      const clearButton = document.getElementById("clear-button");

      function setTokens(tokens) {
        sessionStorage.setItem("auth_tokens", JSON.stringify(tokens));
        tokenOutput.textContent = JSON.stringify(tokens, null, 2);
        const hasTokens = Boolean(tokens?.access_token);
        profileButton.disabled = !hasTokens;
        clearButton.disabled = !hasTokens;
      }

      function clearTokens() {
        sessionStorage.removeItem("auth_tokens");
        tokenOutput.textContent = "(no tokens yet)";
        profileButton.disabled = true;
        clearButton.disabled = true;
      }

      function loadTokens() {
        const stored = sessionStorage.getItem("auth_tokens");
        if (stored) {
          try {
            const parsed = JSON.parse(stored);
            setTokens(parsed);
          } catch (error) {
            console.error("Failed to parse stored tokens", error);
            clearTokens();
          }
        } else {
          clearTokens();
        }
      }

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        loginStatus.textContent = "Logging in...";
        loginStatus.className = "status";

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          const response = await fetch(`${API_BASE_URL}/auth/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, password }),
          });

          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error(error.error || "Login failed");
          }

          const tokens = await response.json();
          setTokens(tokens);
          loginStatus.textContent = "Logged in successfully. Tokens stored in this tab.";
          loginStatus.className = "status success";
        } catch (error) {
          loginStatus.textContent = error.message;
          loginStatus.className = "status error";
          clearTokens();
        }
      });

      profileButton.addEventListener("click", async () => {
        profileStatus.textContent = "Calling protected API...";
        profileStatus.className = "status";

        const stored = sessionStorage.getItem("auth_tokens");
        if (!stored) {
          profileStatus.textContent = "You must log in first.";
          profileStatus.className = "status error";
          return;
        }

        let tokens;
        try {
          tokens = JSON.parse(stored);
        } catch (error) {
          profileStatus.textContent = "Invalid token data. Please log in again.";
          profileStatus.className = "status error";
          clearTokens();
          return;
        }

        try {
          const response = await fetch(`${API_BASE_URL}/protected/profile`, {
            headers: {
              Authorization: `Bearer ${tokens.access_token}`,
            },
          });

          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error(error.error || "Protected call failed");
          }

          const data = await response.json();
          profileOutput.textContent = JSON.stringify(data, null, 2);
          profileStatus.textContent = "Protected data retrieved.";
          profileStatus.className = "status success";
        } catch (error) {
          profileStatus.textContent = error.message;
          profileStatus.className = "status error";
        }
      });

      clearButton.addEventListener("click", () => {
        clearTokens();
        loginStatus.textContent = "Tokens cleared. Please log in again.";
        loginStatus.className = "status";
        profileStatus.textContent = "";
        profileOutput.textContent = "(no data yet)";
      });

      loadTokens();
    </script>
  </body>
</html>
